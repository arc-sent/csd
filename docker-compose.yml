# Поднимает весь проект одной командой: БД + сервер + оба фронтенда + HTTPS.
#   docker compose up --build
#
# После первого запуска (когда образы уже собраны) достаточно:
#   docker compose up
#
# HTTPS — через Caddy (сервис ниже): он сам получает и продлевает бесплатные
# сертификаты Let's Encrypt для трёх доменов (APP_DOMAIN/ADMIN_DOMAIN/
# API_DOMAIN). По умолчанию это домены sslip.io — бесплатный трюк с DNS: имя
# вида app.31-76-46-113.sslip.io само резолвится в IP 31.76.46.113, поэтому
# отдельно покупать домен не нужно. Появится свой домен — просто
# переопределите эти три переменные в .env, никаких других изменений не
# требуется.
#
# Порты 5188/5189/4000 (сайт/админка/API напрямую, без HTTPS) остаются
# доступны как и раньше — HTTPS через Caddy это дополнение, а не замена.
# Переопределяются через .env рядом с этим файлом — см. .env.example.
#
# CSD-server и CSD-app-admin используют build.context: . (корень репозитория),
# а не свои собственные папки — обоим нужен доступ к shared/chess-rules.js
# (общий движок шахматных правил, см. комментарии в их Dockerfile).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chesslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chesslab}
      POSTGRES_DB: ${POSTGRES_DB:-chesslab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chesslab} -d ${POSTGRES_DB:-chesslab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: CSD-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chesslab}:${POSTGRES_PASSWORD:-chesslab}@postgres:5432/${POSTGRES_DB:-chesslab}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      USER_JWT_EXPIRES_IN: ${USER_JWT_EXPIRES_IN:-30d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@chesslab.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-strong-password}
      # И прямые адреса портов (localhost и голый IP — их пускает
      # NODE_ENV=development, см. Dockerfile), и HTTPS-домены Caddy — нужны
      # оба одновременно, поэтому через запятую.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://${APP_DOMAIN:-app.31-76-46-113.sslip.io},https://${ADMIN_DOMAIN:-admin.31-76-46-113.sslip.io}}
      STOCKFISH_PATH: /usr/games/stockfish
      STOCKFISH_ARGS: ${STOCKFISH_ARGS:-}
      STOCKFISH_DEFAULT_DEPTH: ${STOCKFISH_DEFAULT_DEPTH:-14}
      STOCKFISH_MAX_DEPTH: ${STOCKFISH_MAX_DEPTH:-20}
      STOCKFISH_MAX_MOVETIME: ${STOCKFISH_MAX_MOVETIME:-15000}
      # ЮKassa не обязательна для локального запуска: без ключей покупка
      # просто ответит понятной ошибкой, остальной сайт работает как обычно.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_API_URL: ${YOOKASSA_API_URL:-https://api.yookassa.ru/v3}
      # https, не http — теперь у сайта есть настоящий HTTPS-адрес (Caddy).
      # Заодно это и есть адрес для вебхука ЮKassa: .../api/payments/webhook.
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-https://${APP_DOMAIN:-app.31-76-46-113.sslip.io}/index.html}
      PAYMENT_SYNC_INTERVAL_MS: ${PAYMENT_SYNC_INTERVAL_MS:-120000}
      # Без SMTP_HOST/SMTP_USER код подтверждения печатается в лог сервера
      # (docker compose logs server), письмо не уходит — регистрация всё
      # равно работает, см. shared/mailer.js.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ChessSchoolDinamik <no-reply@chesslab.local>}
    ports:
      - "${SERVER_PORT:-4000}:4000"

  app:
    build:
      context: ./CSD-app
      args:
        # https-домен Caddy, не прямой IP:порт — так сайт и с обычного порта
        # 5188, и через HTTPS ходит в один и тот же адрес API.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${API_DOMAIN:-api.31-76-46-113.sslip.io}/api}
        # Адрес самого сайта — для canonical, og:url, robots.txt и sitemap.xml.
        VITE_SITE_URL: ${VITE_SITE_URL:-https://${APP_DOMAIN:-app.31-76-46-113.sslip.io}}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5188}:80"

  admin:
    build:
      context: .
      dockerfile: CSD-app-admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${API_DOMAIN:-api.31-76-46-113.sslip.io}/api}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5189}:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - admin
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.31-76-46-113.sslip.io}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.31-76-46-113.sslip.io}
      API_DOMAIN: ${API_DOMAIN:-api.31-76-46-113.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
