<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Интерактивная платформа для решения шахматных задач." />
  <title>ChessSchoolDinamik — решай задачи и развивай расчёт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Тема выставляется до первой отрисовки и намеренно синхронным скриптом:
       если ждать загрузки React, пользователь с тёмной темой увидит белую
       вспышку на каждой загрузке страницы. Ключ тот же, что в lib/theme.js. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('chesslab-theme');
        var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        // приватный режим/заблокированное хранилище — остаётся светлая тема
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
