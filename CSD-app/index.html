<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Абсолютные адреса (%VITE_SITE_URL%) подставляет Vite при сборке из
       VITE_SITE_URL — в Docker это https://APP_DOMAIN (см. docker-compose.yml),
       локально значение по умолчанию задаёт vite.config.js. -->
  <title>Шахматные задачи онлайн — тренажёр тактики | ChessSchoolDinamik</title>
  <meta name="description" content="Шахматные задачи онлайн с проверкой каждого хода. Уровни от простой тактики до сложных комбинаций, оплата за задание — без подписки. Попробуй бесплатное демо на доске." />
  <!-- keywords Google не учитывает, Яндекс — слабо; оставлен ради него.
       Основная семантика — в title/description/h1 и текстах секций. -->
  <meta name="keywords" content="шахматные задачи онлайн, шахматная тактика, тренажёр по шахматам, решать шахматные задачи, шахматные комбинации, обучение шахматам, тактические задачи по шахматам" />
  <link rel="canonical" href="%VITE_SITE_URL%/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1c19" media="(prefers-color-scheme: dark)" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph / Twitter: превью ссылки в Telegram, VK, WhatsApp, соцсетях. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ChessSchoolDinamik" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:title" content="Шахматные задачи онлайн — тренажёр тактики | ChessSchoolDinamik" />
  <meta property="og:description" content="Решай шахматные задачи на интерактивной доске: проверка каждого хода, уровни сложности, оплата за задание без подписки. Демо — бесплатно." />
  <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ChessSchoolDinamik — начни видеть комбинации на несколько ходов вперёд" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Шахматные задачи онлайн — тренажёр тактики | ChessSchoolDinamik" />
  <meta name="twitter:description" content="Решай шахматные задачи на интерактивной доске: проверка каждого хода, уровни сложности, без подписки." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

  <!-- Шрифты — свои (public/fonts, @font-face в index.css), а не с Google
       Fonts: внешний блокирующий CSS + два лишних DNS/TLS-соединения давали
       заметную задержку первой отрисовки. Preload — только для кириллицы
       Manrope: заголовки на первом экране набраны ею. -->
  <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Структурированные данные: организация и сайт. FAQPage собирается в
       React из тех же вопросов, что показаны на странице (Faq.jsx), чтобы
       разметка не расходилась с текстом. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "%VITE_SITE_URL%/#organization",
        "name": "ChessSchoolDinamik",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/apple-touch-icon.png",
        "email": "hello@chessschooldinamik.example",
        "description": "Платформа для системной тренировки шахматной тактики."
      },
      {
        "@type": "WebSite",
        "@id": "%VITE_SITE_URL%/#website",
        "url": "%VITE_SITE_URL%/",
        "name": "ChessSchoolDinamik",
        "inLanguage": "ru-RU",
        "publisher": {"@id": "%VITE_SITE_URL%/#organization"}
      },
      {
        "@type": "WebApplication",
        "name": "ChessSchoolDinamik",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "ru-RU",
        "description": "Онлайн-тренажёр шахматной тактики с интерактивной доской и проверкой каждого хода.",
        "offers": {"@type": "Offer", "priceCurrency": "RUB", "availability": "https://schema.org/InStock"}
      }
    ]
  }
  </script>

  <!-- Тема выставляется до первой отрисовки и намеренно синхронным скриптом:
       если ждать загрузки React, пользователь с тёмной темой увидит белую
       вспышку на каждой загрузке страницы. Ключ тот же, что в lib/theme.js. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('chesslab-theme');
        var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        // приватный режим/заблокированное хранилище — остаётся светлая тема
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
